services:
  smp-postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    ports:
      - "55433:5432"
    environment:
      POSTGRES_DB: smp
      POSTGRES_USER: peppol
      POSTGRES_PASSWORD: peppol
    volumes:
      - smp-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peppol -d smp"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoss-smp:
    image: ecan/phoss-smp:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
      - peppol-lab
    volumes:
      - smp-data:/var/phoss-smp/data
      - ./config:/config:ro
      - ../phoss-ap/certs:/var/phoss-smp/certs:ro
      - ./db/V100__TestLabSMLInfo.sql:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes/db/migrate-postgresql/V100__TestLabSMLInfo.sql:ro
    depends_on:
      smp-postgres:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:latest
    restart: unless-stopped
    networks:
      - default
      - peppol-lab
    ports:
      - "8783:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "8880:80"
      - "8843:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../phoss-ap/certs:/var/certs:ro
    depends_on:
      - phoss-smp

volumes:
  smp-pg-data:
  smp-data:

networks:
  peppol-lab:
    external: true
