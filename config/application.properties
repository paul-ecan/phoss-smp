# phoss-SMP — Docker test-lab configuration
# Mounted at /config/application.properties; loaded via -Dconfig.file=/config/application.properties

global.debug = false
global.production = false

# Absolute path inside container (Docker volume)
webapp.datapath = /var/phoss-smp/data
webapp.checkfileaccess = false
webapp.testversion = true
webapp.startpage.dynamictable = false
webapp.startpage.participants.none = false

smp.backend = sql

# Self-signed test certificate (mounted from ../phoss-ap/certs/)
smp.keystore.type         = pkcs12
smp.keystore.path         = /var/phoss-smp/certs/test-smp.p12
smp.keystore.password     = peppol
smp.keystore.key.alias    = smp-test-key
smp.keystore.key.password = peppol

# Peppol test truststore from classpath (peppol-commons.jar)
smp.truststore.type     = pkcs12
smp.truststore.path     = truststore/2025/smp-test-truststore.p12
smp.truststore.password = peppol

# Public URL used when generating self-referential SMP URLs
smp.forceroot = true
smp.publicurl = http://turbot:8880/

# No SML registration needed for test lab
sml.enabled = false
sml.smpid = TEST-SMP-ID1

smp.identifiertype = peppol
smp.rest.type = peppol
smp.rest.log.exceptions = true
smp.rest.payload.on.error = true

# Disable outbound integrations
smp.directory.integration.enabled = false

# PostgreSQL (service name "smp-postgres" in docker-compose)
jdbc.database-type  = PostgreSQL
jdbc.driver         = org.postgresql.Driver
jdbc.url            = jdbc:postgresql://smp-postgres:5432/smp
jdbc.user           = peppol
jdbc.password       = peppol
jdbc.schema         = smp
# Auto-create the schema on first startup (PostgreSQL only)
jdbc.schema-create  = true

# Directory client — reuse SMP cert (disabled anyway)
pdclient.keystore.type         = pkcs12
pdclient.keystore.path         = /var/phoss-smp/certs/test-smp.p12
pdclient.keystore.password     = peppol
pdclient.keystore.key.alias    = smp-test-key
pdclient.keystore.key.password = peppol
pdclient.truststore.type     = pkcs12
pdclient.truststore.path     = truststore/2025/smp-test-truststore.p12
pdclient.truststore.password = peppol

# SMP client truststore
smpclient.truststore.type     = pkcs12
smpclient.truststore.path     = truststore/2025/smp-test-truststore.p12
smpclient.truststore.password = peppol
